<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" width="960" height="362" role="img" aria-labelledby="t d">
  <title id="t">How the local LLM tests were run</title>
  <desc id="d">GGUF model files (mostly 4-bit, 2.5 to 11.6 GB) are loaded by llama-server for chat and code, llama-mtmd-cli for OCR, or Real-ESRGAN for upscaling, all running on the Arc B390 integrated GPU through Vulkan with all layers on the GPU, 8 threads, flash attention and one slot. Test prompts with known answers go in, one fresh chat per prompt. The output is checked: speed and wait time, C++ compiled and run, TypeScript type-checked and run, Kotlin read only, OCR line by line, images scored with PSNR. Results go into docs/guide.md with a best pick per task. Everything shares 16 GB of LPDDR5X memory; the GPU can see about 11.4 GB, and models over about 12 GB fail with a Vulkan out-of-memory error.</desc>
  <style>
    :root { --ink:#1f2937; --sub:#57606a; --line:#d0d7de; --card:#ffffff; --on:#0f766e; --tint:#e6f6f4; --group:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --sub:#9198a1; --line:#3d444d; --card:#161b22; --on:#2dd4bf; --tint:#0f2a28; --group:#0d1117; }
    }
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size:14px; font-weight:700; fill:var(--ink); text-anchor:middle; }
    .sub   { font-size:10.5px; fill:var(--sub); text-anchor:middle; }
    .subl  { font-size:10.5px; fill:var(--sub); }
    .pill-t{ font-size:12px; font-weight:600; fill:var(--ink); text-anchor:middle; }
    .lbl   { font-size:10.5px; fill:var(--sub); text-anchor:middle; }
    .barl  { font-size:11px; font-weight:600; fill:var(--ink); }
    .node  { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .group { fill:var(--group); stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; }
    .gpu   { fill:var(--tint); stroke:var(--on); stroke-width:1.5; }
    .rest  { fill:var(--group); stroke:var(--line); stroke-width:1.5; }
    .wire  { stroke:var(--line); stroke-width:1.5; fill:none; }
    .head  { fill:var(--line); }
    .flow  { stroke:var(--on); stroke-width:2; fill:none; stroke-dasharray:3 11; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset:-14; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation:none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10z"/></marker>
  </defs>

  <!-- wires -->
  <path class="wire" d="M190 80 H233" marker-end="url(#a)"/>
  <path class="wire" d="M190 190 H233" marker-end="url(#a)"/>  <path class="flow" d="M190 190 H230"/>
  <path class="wire" d="M495 135 H538" marker-end="url(#a)"/>  <path class="flow" d="M495 135 H535"/>
  <path class="wire" d="M720 135 H763" marker-end="url(#a)"/>  <path class="flow" d="M720 135 H760"/>
  <path class="wire" d="M365 240 V268" marker-end="url(#a)"/>
  <text class="lbl" x="212" y="72">load</text>
  <text class="lbl" x="212" y="182">ask</text>
  <text class="lbl" x="517" y="127">output</text>
  <text class="lbl" x="742" y="127">scores</text>
  <text class="subl" x="376" y="258">weights + context live here</text>

  <!-- inputs -->
  <rect class="node" x="20" y="40" width="170" height="80" rx="12"/>
  <text class="title" x="105" y="66">Model files</text>
  <text class="sub" x="105" y="86">GGUF, mostly 4-bit</text>
  <text class="sub" x="105" y="102">2.5–11.6 GB each</text>

  <rect class="node" x="20" y="150" width="170" height="80" rx="12"/>
  <text class="title" x="105" y="174">Test prompts</text>
  <text class="sub" x="105" y="194">known answers</text>
  <text class="sub" x="105" y="209">one fresh chat each</text>
  <text class="sub" x="105" y="224">+ OCR pages, test chart</text>

  <!-- inference group -->
  <rect class="group" x="235" y="25" width="260" height="215" rx="14"/>
  <text class="title" x="365" y="48">On the iGPU (Vulkan)</text>
  <rect class="node" x="255" y="62"  width="220" height="32" rx="8"/><text class="pill-t" x="365" y="83">llama-server · chat, code</text>
  <rect class="node" x="255" y="102" width="220" height="32" rx="8"/><text class="pill-t" x="365" y="123">llama-mtmd-cli · OCR</text>
  <rect class="node" x="255" y="142" width="220" height="32" rx="8"/><text class="pill-t" x="365" y="163">Real-ESRGAN · upscaling</text>
  <text class="sub" x="365" y="200">-ngl 99 · -t 8 · -fa on · -np 1</text>
  <text class="sub" x="365" y="218">Intel Arc B390 (Xe3, integrated)</text>

  <!-- checks -->
  <rect class="node" x="540" y="40" width="180" height="190" rx="12"/>
  <text class="title" x="630" y="66">Checks</text>
  <text class="sub" x="630" y="90">speed (t/s) and wait time</text>
  <text class="sub" x="630" y="110">C++: g++ -std=c++17, run</text>
  <text class="sub" x="630" y="130">TypeScript: tsc --strict, run</text>
  <text class="sub" x="630" y="150">Kotlin: read only</text>
  <text class="sub" x="630" y="170">OCR: line by line</text>
  <text class="sub" x="630" y="190">images: PSNR vs original</text>
  <text class="sub" x="630" y="210">pass · partial · fail</text>

  <!-- results -->
  <rect class="node" x="765" y="40" width="175" height="190" rx="12"/>
  <text class="title" x="852.5" y="100">Results</text>
  <text class="sub" x="852.5" y="124">best pick per task</text>
  <text class="sub" x="852.5" y="142">tuning notes</text>
  <text class="sub" x="852.5" y="160">docs/guide.md</text>

  <!-- shared memory -->
  <rect class="node" x="20" y="270" width="920" height="80" rx="12"/>
  <text class="barl" x="40" y="292">Shared memory: 16 GB LPDDR5X, used by both the CPU and the GPU</text>
  <rect class="gpu"  x="40"  y="302" width="627" height="30" rx="6"/>
  <rect class="rest" x="671" y="302" width="249" height="30" rx="6"/>
  <text class="subl" x="52"  y="321">GPU can use ≈ 11.4 GB: model + KV cache + desktop apps compete</text>
  <text class="subl" x="683" y="321">rest: CPU and system</text>
  <text class="subl" x="920" y="292" text-anchor="end">models over ~12 GB: Vulkan out-of-memory</text>
</svg>
